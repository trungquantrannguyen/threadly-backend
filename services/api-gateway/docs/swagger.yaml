basePath: /api
definitions:
  dto.AuthData:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserData'
    type: object
  dto.CreatePostRequest:
    properties:
      content:
        type: string
      visibility:
        type: string
    required:
    - content
    type: object
  dto.DeleteUserResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.ErrorResponse:
    properties:
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.FeedPostResponse:
    properties:
      author:
        $ref: '#/definitions/dto.FeedUserSummary'
      author_id:
        type: string
      bookmark_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      like_count:
        type: integer
      reply_count:
        type: integer
      repost_count:
        type: integer
      updated_at:
        type: string
      visibility:
        type: string
    type: object
  dto.FeedUserSummary:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      username:
        type: string
    type: object
  dto.GetContentServiceHealthData:
    properties:
      checked_at:
        type: string
      env:
        type: string
      service:
        type: string
      status:
        type: string
    type: object
  dto.GetContentServiceHealthResponse:
    properties:
      data:
        $ref: '#/definitions/dto.GetContentServiceHealthData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.GetFeedServiceHealthData:
    properties:
      checked_at:
        type: string
      env:
        type: string
      service:
        type: string
      status:
        type: string
    type: object
  dto.GetFeedServiceHealthResponse:
    properties:
      data:
        $ref: '#/definitions/dto.GetFeedServiceHealthData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.GetMeResponse:
    properties:
      data:
        $ref: '#/definitions/dto.UserData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.GetNotificationServiceHealthData:
    properties:
      checked_at:
        type: string
      env:
        type: string
      service:
        type: string
      status:
        type: string
    type: object
  dto.GetNotificationServiceHealthResponse:
    properties:
      data:
        $ref: '#/definitions/dto.GetNotificationServiceHealthData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.GetStorageServiceHealthData:
    properties:
      checked_at:
        type: string
      env:
        type: string
      service:
        type: string
      status:
        type: string
    type: object
  dto.GetStorageServiceHealthResponse:
    properties:
      data:
        $ref: '#/definitions/dto.GetStorageServiceHealthData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.GetUserServiceHealthData:
    properties:
      checked_at:
        type: string
      env:
        type: string
      service:
        type: string
      status:
        type: string
    type: object
  dto.GetUserServiceHealthResponse:
    properties:
      data:
        $ref: '#/definitions/dto.GetUserServiceHealthData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.HomeFeedData:
    properties:
      next_cursor:
        type: string
      posts:
        items:
          $ref: '#/definitions/dto.FeedPostResponse'
        type: array
    type: object
  dto.HomeFeedResponse:
    properties:
      data:
        $ref: '#/definitions/dto.HomeFeedData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.LoginRequest:
    properties:
      email_or_username:
        type: string
      password:
        type: string
    required:
    - email_or_username
    - password
    type: object
  dto.LoginResponse:
    properties:
      data:
        $ref: '#/definitions/dto.AuthData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.LogoutResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.PostResponse:
    properties:
      author:
        $ref: '#/definitions/dto.UserSummary'
      author_id:
        type: string
      bookmark_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      like_count:
        type: integer
      reply_count:
        type: integer
      reply_to_post_id:
        type: string
      repost_count:
        type: integer
      updated_at:
        type: string
      visibility:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RefreshTokenResponse:
    properties:
      data:
        $ref: '#/definitions/dto.AuthData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.RegisterRequest:
    properties:
      display_name:
        maxLength: 100
        minLength: 1
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - display_name
    - email
    - password
    - username
    type: object
  dto.RegisterResponse:
    properties:
      data:
        $ref: '#/definitions/dto.AuthData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.UpdateProfileRequest:
    properties:
      avatar_url:
        maxLength: 2048
        type: string
      banner_url:
        maxLength: 2048
        type: string
      bio:
        maxLength: 280
        type: string
      display_name:
        maxLength: 80
        minLength: 1
        type: string
      location:
        maxLength: 100
        type: string
      website_url:
        maxLength: 2048
        type: string
    type: object
  dto.UpdateProfileResponse:
    properties:
      data:
        $ref: '#/definitions/dto.UserData'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.UserData:
    properties:
      avatar_url:
        type: string
      banner_url:
        type: string
      bio:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      location:
        type: string
      role:
        type: string
      username:
        type: string
      website_url:
        type: string
    type: object
  dto.UserSummary:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      username:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    Public REST API documentation for Threadly.
    Threadly is a Twitter/X-style social media platform using Go microservices, gRPC, PostgreSQL, Redis, and RabbitMQ.
  title: Threadly API Gateway
  version: "1.0"
paths:
  /contents/health:
    get:
      consumes:
      - application/json
      description: Get the status of content service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetContentServiceHealthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Content service health
      tags:
      - Contents
  /contents/posts:
    post:
      consumes:
      - application/json
      description: Creates a new Threadly post of a user and returns the new post.
      parameters:
      - description: Create post request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.PostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a post
      tags:
      - Contents
  /contents/posts/{postID}:
    delete:
      description: Returns the delete post status.
      parameters:
      - description: postID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema: {}
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a post
      tags:
      - Contents
    get:
      description: Returns the requested post.
      parameters:
      - description: postID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PostResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a post
      tags:
      - Contents
  /contents/posts/{postID}/bookmarks:
    delete:
      description: Removes the authenticated user's bookmark from a post.
      parameters:
      - description: postID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unbookmark a post
      tags:
      - Contents
    post:
      description: Bookmarks a post as the authenticated user.
      parameters:
      - description: postID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Bookmark a post
      tags:
      - Contents
  /contents/posts/{postID}/likes:
    delete:
      description: Removes the authenticated user's like from a post.
      parameters:
      - description: postID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unlike a post
      tags:
      - Contents
    post:
      description: Likes a post as the authenticated user.
      parameters:
      - description: postID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Like a post
      tags:
      - Contents
  /contents/posts/{postID}/replies:
    get:
      consumes:
      - application/json
      description: Returns replies for a post.
      parameters:
      - description: postID
        in: path
        name: postID
        required: true
        type: string
      - in: query
        name: cursor
        type: string
      - in: query
        maximum: 50
        minimum: 0
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PostResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get replies of a post
      tags:
      - Contents
    post:
      consumes:
      - application/json
      description: Creates a new reply to a post and returns the new reply.
      parameters:
      - description: postID
        in: path
        name: postID
        required: true
        type: string
      - description: Create reply request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.PostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a reply post
      tags:
      - Contents
  /contents/posts/{postID}/reposts:
    delete:
      description: Removes the authenticated user's repost from a post.
      parameters:
      - description: postID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Undo repost
      tags:
      - Contents
    post:
      description: Reposts a post as the authenticated user.
      parameters:
      - description: postID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Repost a post
      tags:
      - Contents
  /contents/users/{userID}/follow:
    delete:
      description: Authenticated user unfollows another user.
      parameters:
      - description: target userID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unfollow a user
      tags:
      - Contents
    post:
      description: Authenticated user follows another user.
      parameters:
      - description: target userID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Follow a user
      tags:
      - Contents
  /contents/users/{userID}/followers:
    get:
      description: Returns users who follow the requested user.
      parameters:
      - description: userID
        in: path
        name: userID
        required: true
        type: string
      - description: limit
        in: query
        name: limit
        type: integer
      - description: cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.UserSummary'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user followers
      tags:
      - Contents
  /contents/users/{userID}/following:
    get:
      description: Returns users that the requested user follows.
      parameters:
      - description: userID
        in: path
        name: userID
        required: true
        type: string
      - description: limit
        in: query
        name: limit
        type: integer
      - description: cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.UserSummary'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get users followed by a user
      tags:
      - Contents
  /feeds/health:
    get:
      consumes:
      - application/json
      description: Get the status of feed service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetFeedServiceHealthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Feed service health
      tags:
      - Feeds
  /feeds/home:
    get:
      description: Returns the authenticated user's home feed.
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HomeFeedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get home feed
      tags:
      - Feeds
  /health:
    get:
      consumes:
      - application/json
      description: Get the status of user service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get User service health
  /notifications:
    get:
      description: Get notifications for the authenticated user
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get my notifications
      tags:
      - Notifications
  /notifications/{id}/read:
    patch:
      description: Mark one notification as read for the authenticated user
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
