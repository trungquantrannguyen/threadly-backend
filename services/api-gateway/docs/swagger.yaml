      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - display_name
    - email
    - password
    - username
    type: object
  github_com_trungquantrannguyen_threadly_services_api-gateway_internal_dto.ResgisterReponse:
    properties:
      data:
