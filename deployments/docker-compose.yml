services:
  postgres:
    image: postgres:16-alpine
    container_name: threadly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: threadly
    ports:
      - "5432:5432"
    volumes:
      - threadly_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: threadly_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: threadly_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  threadly_postgres_data:
