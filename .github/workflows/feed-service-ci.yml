name: Feed Service CI

on:
  pull_request:
    branches: [main]
    paths:
      - "services/feed-service/**"
      - "pkg/**"
      - "proto/**"
      - "db/**"
      - "go.mod"
      - "go.sum"
      - "docker-compose.yml"
      - ".github/workflows/**"

  push:
    branches: [main]
    paths:
      - "services/feed-service/**"
      - "pkg/**"
      - "proto/**"
      - "db/**"
      - "go.mod"
      - "go.sum"
      - "docker-compose.yml"
      - ".github/workflows/**"

  workflow_dispatch:

jobs:
  test-feed-service:
    name: Test Feed Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l services/feed-service pkg db proto)
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./services/feed-service/... ./pkg/... ./db/... ./proto/...

      - name: Run Feed Service tests with coverage
        run: |
          mkdir -p test/feed-service
          go test ./services/feed-service/... \
            -coverprofile=test/feed-service/coverage.out \
            -covermode=atomic
          go tool cover -func=test/feed-service/coverage.out

      - name: Detect shared changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "shared_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -Eq '^(pkg/|proto/|db/|go\.mod$|go\.sum$|docker-compose\.yml$|\.github/workflows/)'; then
            echo "shared_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "shared_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run shared package tests
        if: steps.changes.outputs.shared_changed == 'true'
        run: go test ./pkg/... ./db/... ./proto/...
