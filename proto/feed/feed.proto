syntax = "proto3";

package feed;
option go_package = "threadly/proto/feed;feedv1";

service FeedService {
    rpc GetHealth(GetFeedServiceHealthRequest) returns (GetFeedServiceHealthResponse);
    rpc GetHomeFeed(GetHomeFeedRequest) returns (HomeFeedResponse);
}

message GetFeedServiceHealthRequest {}

message GetFeedServiceHealthResponse {
    string service = 1;
    string status = 2;
    string env = 3;
    string checked_at = 4;
}

message GetHomeFeedRequest {
    string user_id = 1;
    int32 limit = 2;
    string cursor = 3;
}

message HomeFeedResponse {
    repeated FeedPostResponse posts = 1;
    string next_cursor = 2;
}

message FeedPostResponse {
    string id = 1;
    string author_id = 2;
    string content = 3;
    string visibility = 4;

    int32 like_count = 5;
    int32 reply_count = 6;
    int32 repost_count = 7;
    int32 bookmark_count = 8;

    string created_at = 9;
    string updated_at = 10;

    FeedUserSummary author = 11;
}

message FeedUserSummary {
    string id = 1;
    string username = 2;
    string display_name = 3;
    string avatar_url = 4;
    bool is_verified = 5;
}