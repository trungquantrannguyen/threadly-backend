syntax = "proto3";

package user;
option go_package = "threadly/proto/user;userv1";

service UserService {
    rpc GetHealth(GetUserServiceHealthRequest) returns (GetUserServiceHealthResponse);
}

message GetUserServiceHealthRequest {}

message GetUserServiceHealthResponse {
    string service = 1;
    string status = 2;
    string env = 3;
    string checked_at = 4;
}